<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Options Bridge</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="mode-banner" class="mode-banner" role="status" aria-live="polite"></div>

  <header class="topbar">
    <div class="brand">Options Bridge <span class="muted">TradingView → options</span></div>
    <div class="chips" id="chips"></div>
    <div class="controls">
      <button id="btn-pause" class="btn"></button>
      <button id="btn-emergency" class="btn btn-danger">Emergency close</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" class="tab active">Overview</button>
    <button role="tab" data-tab="history" class="tab">History &amp; stats</button>
    <button role="tab" data-tab="signals" class="tab">Signals &amp; log</button>
    <button role="tab" data-tab="settings" class="tab">Settings</button>
  </nav>

  <main>
    <!-- OVERVIEW -->
    <section id="tab-overview" class="tabpanel">
      <div class="panel">
        <div class="panel-head"><h2 id="account-title">Paper account</h2></div>
        <div class="tiles" id="account-tiles"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Open positions</h2></div>
        <div id="positions" class="positions"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Paper equity</h2>
          <div class="seg" id="equity-range">
            <button data-range="today">Today</button><button data-range="week">Week</button><button data-range="month">Month</button><button data-range="all" class="on">All</button>
          </div>
          <button class="link" id="equity-table-toggle">Table view</button>
        </div>
        <div class="chart" id="equity-chart"></div>
        <div id="equity-table" hidden></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Latest signals</h2></div>
        <div id="signals-short"></div>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" class="tabpanel" hidden>
      <div class="panel">
        <div class="panel-head">
          <h2>Performance</h2>
          <label>Mode <select id="stats-mode"><option>OBSERVE</option><option>LIVE</option></select></label>
          <label>Group by <select id="stats-group">
            <option value="">—</option><option value="strategy">Strategy</option><option value="direction">Direction</option>
            <option value="signal_type">Signal type</option><option value="date">Date</option>
            <option value="expiration_mode">Expiration mode</option><option value="dte">DTE</option>
            <option value="strike_mode">Strike selection</option><option value="exit_reason">Exit reason</option>
          </select></label>
        </div>
        <div class="tiles" id="stats-tiles"></div>
        <div id="stats-groups"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Trade history</h2></div>
        <div class="table-wrap"><table id="trades-table"></table></div>
      </div>
    </section>

    <!-- SIGNALS -->
    <section id="tab-signals" class="tabpanel" hidden>
      <div class="panel">
        <div class="panel-head"><h2>Webhook events</h2></div>
        <div class="table-wrap"><table id="signals-table"></table></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>System log</h2>
          <label>Level <select id="log-level"><option value="">All</option><option>WARN</option><option>ERROR</option><option>CRITICAL</option></select></label>
        </div>
        <div class="table-wrap"><table id="log-table"></table></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tabpanel" hidden>
      <div class="panel">
        <div class="panel-head"><h2>System mode</h2></div>
        <div class="mode-picker" id="mode-picker"></div>
        <p class="hint" id="mode-hint"></p>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Strategy</h2>
          <select id="strategy-select"></select>
        </div>
        <form id="strategy-form" class="form-grid"></form>
        <div class="form-actions"><button class="btn btn-primary" id="save-strategy">Save strategy</button><span class="save-msg" id="strategy-msg"></span></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Risk limits &amp; fills</h2></div>
        <form id="risk-form" class="form-grid"></form>
        <div class="form-actions"><button class="btn btn-primary" id="save-risk">Save risk limits</button><span class="save-msg" id="risk-msg"></span></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>System</h2></div>
        <form id="system-form" class="form-grid"></form>
        <div class="form-actions"><button class="btn btn-primary" id="save-system">Save system settings</button><span class="save-msg" id="system-msg"></span></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Paper account</h2></div>
        <div class="form-grid">
          <label>New starting balance ($)<input type="number" id="reset-balance" min="1" step="100"></label>
        </div>
        <div class="form-actions"><button class="btn" id="reset-paper">Reset paper account…</button><button class="btn" id="reconcile">Run consistency check</button><span class="save-msg" id="paper-msg"></span></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Send a test signal</h2><span class="muted">OBSERVE / DRY_RUN only</span></div>
        <div class="form-grid">
          <label>Action<select id="ts-action">
            <option>ENTER_LONG</option><option>ENTER_SHORT</option><option>EXIT_LONG</option><option>EXIT_SHORT</option>
            <option>REVERSE_LONG</option><option>REVERSE_SHORT</option><option>CLOSE_ALL</option></select></label>
          <label>Strategy<input id="ts-strategy" value="reversal_v6"></label>
          <label>Symbol<input id="ts-symbol" value="NQ1!"></label>
          <label>Exit reason<input id="ts-reason" placeholder="TARGET / STOP"></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary" id="ts-send">Send</button><span class="save-msg" id="ts-msg"></span></div>
      </div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
